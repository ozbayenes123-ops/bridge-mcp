[project]
name = "bridge-mcp"
version = "0.2.0"
description = "Bridge MCP: birleşik tool'larla yerel MCP'leri (Zotero, Shamela, yargi, makale) birbirine bağlar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2",
    "markitdown[pdf]>=0.1.1",
    "pyzotero>=1.5.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
bridge-mcp = "bridge_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge_mcp"]
